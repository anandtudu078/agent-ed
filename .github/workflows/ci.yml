name: CI

# Cancel superseded runs on the same branch. A re-push mid-review makes the
# previous result irrelevant, and a stale green tick next to a new commit is
# worse than no tick at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Fast gate: types, lint, and a full build of both halves. No services, no
  # browser, no API keys — so it stays under a minute and fails within seconds
  # of a regression rather than after a slow job has burned ten minutes.
  verify:
    name: Types, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install (server)
        run: npm ci

      - name: Install (client)
        run: npm ci --prefix client

      - name: Typecheck server
        run: npx tsc --noEmit

      # Runs in client/ rather than via `tsc --prefix`: tsc has no --prefix
      # option, and it fails with TS5023 rather than checking anything.
      - name: Typecheck client
        run: npx tsc --noEmit
        working-directory: client

      # The layer tsc cannot see: dead variables, orphaned expressions, and the
      # accidental globals that only bite plain-JS scripts. One flat config at
      # the repository root (eslint.config.mjs) covers server and client alike —
      # same `npm run lint` a developer runs locally.
      - name: Lint
        run: npm run lint

      # A typecheck proves the code compiles; a build proves the artefact
      # exists. The client build also exercises the multi-page entry points in
      # vite.config.ts — an HTML file that goes missing fails here instead of
      # 404ing only in production.
      - name: Build server
        run: npm run build

      - name: Build client
        run: npm run build --prefix client
