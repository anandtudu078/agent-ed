<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentEd — Socratic AI Mentor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="h-full bg-slate-950 text-slate-100 antialiased">
    <div class="flex h-full flex-col">
      <!-- Header -->
      <header
        class="flex items-center gap-3 border-b border-slate-800 bg-slate-900/80 px-4 py-3 backdrop-blur"
      >
        <div
          class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 text-lg shadow-lg shadow-indigo-900/40"
        >
          🎓
        </div>
        <div class="min-w-0">
          <h1 class="truncate text-base font-semibold tracking-tight">
            AgentEd <span class="text-slate-400">—</span>
            <span class="bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">
              Socratic AI Mentor
            </span>
          </h1>
          <p class="truncate text-xs text-slate-400">
            Guided learning through questions, not answers
          </p>
        </div>
        <span
          id="connection-status"
          class="ml-auto flex items-center gap-1.5 rounded-full bg-slate-800 px-2.5 py-1 text-xs font-medium text-slate-400"
        >
          <span id="status-dot" class="h-1.5 w-1.5 rounded-full bg-amber-400"></span>
          <span id="status-text">Connecting…</span>
        </span>
      </header>

      <!-- Chat area -->
      <main
        id="chat-container"
        class="flex-1 overflow-y-auto px-4 py-6 scroll-smooth"
        aria-label="Conversation with AgentEd"
        aria-live="polite"
      >
        <div id="messages" class="mx-auto flex w-full max-w-3xl flex-col gap-4"></div>
      </main>

      <!-- Control bar -->
      <footer class="border-t border-slate-800 bg-slate-900/80 px-4 py-3 backdrop-blur">
        <form id="chat-form" class="mx-auto flex max-w-3xl flex-col gap-2 sm:flex-row sm:items-center">
          <label for="message-input" class="sr-only">Your question</label>
          <input
            id="message-input"
            type="text"
            autocomplete="off"
            placeholder="Ask about any concept…"
            class="min-w-0 flex-1 rounded-xl border border-slate-700 bg-slate-800/70 px-4 py-3 text-sm placeholder-slate-500 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30"
          />
          <button
            id="send-button"
            type="submit"
            class="rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-900/40 transition hover:bg-indigo-500 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50"
          >
            Send
          </button>
          <button
            id="voice-toggle"
            type="button"
            aria-pressed="false"
            title="Toggle voice mode"
            class="rounded-xl border border-slate-700 bg-slate-800/70 px-4 py-3 text-sm font-medium text-slate-300 transition hover:border-slate-600 hover:text-white active:scale-95"
          >
            🎤 <span class="hidden sm:inline">Voice Mode</span>
          </button>
        </form>
        <p id="voice-hint" class="mx-auto mt-2 hidden max-w-3xl text-center text-xs text-slate-500"></p>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
