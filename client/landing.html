<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      This page used to BE the landing page. It is now the root URL (index.html),
      with the tutor at /app.html.

      This stub keeps /landing.html alive so any link already shared, bookmarked
      or cached still resolves. Without it those links would 404, and the person
      following one has no way to tell a moved page from a broken site.

      Deliberately no Tailwind or webfont: this document exists only to hand over
      to `/`, and every asset it waits on is delay on the way to the real page.

      The <noscript> link and the visible text are not decoration. A bare
      meta-refresh is invisible to a screen reader announcing the page, and does
      nothing at all where refresh is blocked — both would leave someone staring
      at a blank document.
    -->
    <meta http-equiv="refresh" content="0; url=/" />
    <!--
      No <link rel="canonical"> here, deliberately. A canonical pointing at the
      bare `/` makes Vite try to resolve `/` as a build asset, find the project
      root directory, and fail the whole build with EISDIR. The meta refresh and
      the script below already state the destination; the canonical would only
      repeat it to crawlers at the cost of breaking the deploy.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>"
    />
    <title>AgentEd</title>
    <script>
      // Belt and braces alongside the meta refresh, which some in-app browsers
      // and crawlers handle unreliably. `replace` so Back does not bounce the
      // user straight back into this redirect.
      window.location.replace("/");
    </script>
  </head>
  <body>
    <p>
      This page has moved.
      <a href="/">Continue to AgentEd</a>.
    </p>
  </body>
</html>
